- title: Projects
  type: time_table
  contents:
    - title: "Tipping the Social Balance: Computational Perspectives on the Dynamics of Collective Behavior, Norms and Policy Interventions"
      year: 2021 – 2025
      description:
        - Computational approaches to understand collective behavior for effective stewardship.
    - title: Mask-wearing Behavior During COVID-19
      year: 2024 – 2025
      description:
        - Visiting Researcher at Princeton University.
        - Studied global mask-wearing patterns using behavioral modeling.
    - title: "The Cost of Large-Scale Transitions: Introducing Effective Targeted Incentives"
      year: 2024 – 2025
      description:
        - Grant received under ENLENS RPA from UvA.
        - Studied trade-offs essential for optimal interventions.
    - title: CMIP6 Heatwave Analysis
      year: 2021 – 2022
      description:
        - Assessed heat stress and heatwave projections for the 21st century based on CMIP6 data.
        - Collaboration with MPI Chemistry and IIT Ropar.
        
